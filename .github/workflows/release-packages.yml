# GitHub discovers this workflow after it is committed and pushed.
# Manual dispatch requires the workflow on the default branch. Local tasks use gh.
# Build-only: dispatch main with tag blank and publish unchecked.
# Existing tag: dispatch on that tag using the VS Code task or gh --ref vX.Y.Z.
# The tag input only verifies the selected ref; it cannot choose different source.
# Publish: push a new vX.Y.Z tag, or dispatch on a tag with publish checked.
name: Build Minimize2Tray packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag assertion (vX.Y.Z). Tag builds must run on that tag via --ref.'
        required: false
        type: string
        default: ''
      target:
        description: 'Target to check (publishing requires all)'
        required: false
        type: choice
        default: all
        options:
          - all
          - archlinux
          - gentoo
      publish:
        description: 'Publish a GitHub Release (requires an existing tag)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Selected-tag builds must not read or poison shared Actions caches.
cache-mode: none

concurrency:
  group: packages-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref_name || inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate version and make pinned source archive
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.source.outputs.version }}
      deb_version: ${{ steps.source.outputs.deb_version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      tag: ${{ steps.source.outputs.tag }}
      archive_name: ${{ steps.source.outputs.archive_name }}
      archive_sha256: ${{ steps.source.outputs.archive_sha256 }}
    steps:
      - name: Validate inputs before checking out source
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          WANT_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          SELECTED_SHA: ${{ github.sha }}
          SELECTED_REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          TARGET: ${{ github.event_name == 'push' && 'all' || inputs.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in all|archlinux|gentoo) ;; *) echo '::error::Invalid build target.'; exit 1 ;; esac
          if [[ "$WANT_PUBLISH" == 'true' && "$TARGET" != all ]]; then
            echo '::error::Publishing requires all package targets.'; exit 1
          fi
          core='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          if [[ -n "$REQUESTED_TAG" && ! "$REQUESTED_TAG" =~ ^v$core$ ]]; then
            echo '::error::Tag must be in vX.Y.Z format, without leading zeroes.'; exit 1
          fi
          if [[ "$WANT_PUBLISH" == 'true' && -z "$REQUESTED_TAG" ]]; then
            echo '::error::Publishing requires an existing version tag.'; exit 1
          fi
          [[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "$REQUESTED_TAG" && "$SELECTED_REF" != "refs/tags/$REQUESTED_TAG" ]]; then
            echo '::error::Tag builds must be dispatched on the tag itself (gh --ref vX.Y.Z or the VS Code tag task).'; exit 1
          fi
          if [[ -n "$INPUT_TAG" && "$INPUT_TAG" != "$REQUESTED_TAG" ]]; then
            echo '::error::Tag input does not match the workflow ref.'; exit 1
          fi

      - name: Check out the immutable workflow commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify versions and source identity
        id: source
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          core='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          source_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          workflow_commit="$(git rev-parse --verify "$WORKFLOW_SHA^{commit}")"
          [[ "$source_sha" == "$workflow_commit" ]] || { echo '::error::Source does not match the workflow commit.'; exit 1; }
          if [[ -n "$tag" ]]; then
            # Resolve the tag only to verify it; never check out input-selected code.
            git fetch --no-tags --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
            tagged_sha="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
            if [[ "$tagged_sha" != "$source_sha" ]]; then
              echo "::error::Tag $tag does not point to the checked-out commit."; exit 1
            fi
          fi

          version="$(python3 -c 'import json; print(json.load(open("package/metadata.json"))["KPlugin"]["Version"])')"
          if [[ ! "$version" =~ ^$core$ ]]; then
            echo "::error::Invalid application version: $version"; exit 1
          fi
          deb_version="$(dpkg-parsechangelog -l distro/debian/changelog -S Version)"
          if [[ ! "$deb_version" =~ ^$core-[1-9][0-9]*$ || "${deb_version%%-*}" != "$version" ]]; then
            echo "::error::Debian changelog version $deb_version does not match $version."; exit 1
          fi
          if ! grep -Fqx "%{!?release_version:%global release_version $version}" distro/rpm/kwin6-script-minimize2tray.spec; then
            echo "::error::RPM spec default version does not match $version."; exit 1
          fi
          if ! grep -Fqx "pkgver=$version" distro/arch/PKGBUILD; then
            echo '::error::Arch PKGBUILD version does not match metadata.'; exit 1
          fi
          test -s "distro/gentoo/kde-misc/kwin6-script-minimize2tray/kwin6-script-minimize2tray-$version.ebuild"
          if [[ -n "$tag" && "$tag" != "v$version" ]]; then
            echo "::error::Tag $tag does not match v$version."; exit 1
          fi
          for file in distro/prepare.py distro/arch/PKGBUILD distro/gentoo/metadata/layout.conf distro/gentoo/profiles/repo_name distro/gentoo/kde-misc/kwin6-script-minimize2tray/metadata.xml distro/debian/prepare.py distro/debian/control distro/debian/rules distro/debian/kwin6-script-minimize2tray.install distro/rpm/kwin6-script-minimize2tray.spec plugin/CMakeLists.txt; do
            test -s "$file" || { echo "::error::Missing packaging file: $file"; exit 1; }
          done

          # All package targets use this one archive from the exact commit.
          # Its top-level directory matches the archive layout expected by
          # the existing RPM %prep and Debian prepare.py scripts.
          if [[ -n "$tag" ]]; then source_suffix="$version"; else source_suffix="$source_sha"; fi
          archive_name="kwin-minimize2tray-$source_suffix.tar.gz"
          mkdir -p source
          git archive --format=tar.gz --prefix="kwin-minimize2tray-$source_suffix/" HEAD -o "source/$archive_name"
          test -s "source/$archive_name"
          tar -tzf "source/$archive_name" | grep -Fx "kwin-minimize2tray-$source_suffix/CMakeLists.txt" > /dev/null
          archive_sha256="$(sha256sum "source/$archive_name" | cut -d ' ' -f 1)"

          {
            echo "version=$version"
            echo "deb_version=$deb_version"
            echo "source_sha=$source_sha"
            echo "tag=$tag"
            echo "archive_name=$archive_name"
            echo "archive_sha256=$archive_sha256"
          } >> "$GITHUB_OUTPUT"
          echo "Source commit: $source_sha"
          echo "Package version: $version (Debian $deb_version)"

      - name: Upload pinned source for all build jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pinned-source
          path: source/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  tumbleweed:
    if: github.event_name == 'push' || inputs.target == 'all'
    name: openSUSE Tumbleweed RPM (x86_64)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: opensuse/tumbleweed:latest
    steps:
      - name: Install RPM build tooling
        shell: bash
        run: |
          set -euo pipefail
          zypper --non-interactive refresh
          zypper --non-interactive install --no-recommends rpm-build git ca-certificates tar gzip make

      - name: Check out RPM packaging from the workflow commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install build dependencies declared by the RPM spec
        shell: bash
        run: |
          set -euo pipefail
          requirements="$(rpmspec -q --buildrequires distro/rpm/kwin6-script-minimize2tray.spec)"
          [[ -n "$requirements" ]]
          mapfile -t build_requires <<< "$requirements"
          zypper --non-interactive install --no-recommends "${build_requires[@]}"

      - name: Download verified source archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pinned-source
          path: _source

      - name: Compile RPM using the existing spec
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.source_sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ARCHIVE_NAME: ${{ needs.prepare.outputs.archive_name }}
          ARCHIVE_SHA256: ${{ needs.prepare.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          echo "$ARCHIVE_SHA256  _source/$ARCHIVE_NAME" | sha256sum --check --strict
          topdir="$RUNNER_TEMP/rpmbuild"
          mkdir -p "$topdir"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          if [[ -n "$TAG" ]]; then
            cp "_source/$ARCHIVE_NAME" "$topdir/SOURCES/kwin6-script-minimize2tray-PhobosK-$TAG.tar.gz"
            commit_args=()
          else
            cp "_source/$ARCHIVE_NAME" "$topdir/SOURCES/kwin6-script-minimize2tray-PhobosK-$SHA.tar.gz"
            commit_args=(--define "commit $SHA")
          fi
          rpmbuild -ba --define "_topdir $topdir" --define "release_version $VERSION" "${commit_args[@]}" distro/rpm/kwin6-script-minimize2tray.spec
          mkdir -p dist
          find "$topdir/RPMS" -type f -name "kwin6-script-minimize2tray-$VERSION-*.x86_64.rpm" -exec cp -v '{}' dist/ \;
          shopt -s nullglob
          rpms=(dist/*.x86_64.rpm)
          [[ ${#rpms[@]} -eq 1 ]] || { echo '::error::Exactly one RPM expected.'; exit 1; }
          [[ "$(rpm -qp --qf '%{NAME}' "${rpms[0]}")" == 'kwin6-script-minimize2tray' ]]
          [[ "$(rpm -qp --qf '%{VERSION}' "${rpms[0]}")" == "$VERSION" ]]
          [[ "$(rpm -qp --qf '%{ARCH}' "${rpms[0]}")" == 'x86_64' ]]
          rpm -qpl "${rpms[0]}" | grep -F 'kcm_minimize2tray.so'
          rpm -qpl "${rpms[0]}" | grep -F 'trayiconplugin.so'
          rpm -qpl "${rpms[0]}" | grep -F 'com.github.luisbocanegra.minimize2tray/'

      - name: Upload RPM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pkg-tumbleweed
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 14

  debian_ubuntu:
    if: github.event_name == 'push' || inputs.target == 'all'
    name: ${{ matrix.name }} DEB (amd64)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13 Trixie
            label: debian13
            image: debian:trixie
          - name: Ubuntu 26.04 LTS
            label: ubuntu2604
            image: ubuntu:26.04
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Enable repositories and install Debian build tooling
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          apt-get update
          if [[ "$LABEL" == 'ubuntu2604' ]]; then
            apt-get install -y --no-install-recommends software-properties-common
            add-apt-repository -y universe
            apt-get update
          fi
          apt-get install -y --no-install-recommends ca-certificates git python3 dpkg-dev build-essential debhelper devscripts equivs

      - name: Check out Debian packaging from the workflow commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified source archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pinned-source
          path: _source

      - name: Compile DEB using the existing Debian packaging
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
          VERSION: ${{ needs.prepare.outputs.version }}
          DEB_VERSION: ${{ needs.prepare.outputs.deb_version }}
          SHA: ${{ needs.prepare.outputs.source_sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ARCHIVE_NAME: ${{ needs.prepare.outputs.archive_name }}
          ARCHIVE_SHA256: ${{ needs.prepare.outputs.archive_sha256 }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          echo "$ARCHIVE_SHA256  _source/$ARCHIVE_NAME" | sha256sum --check --strict
          if [[ -n "$TAG" ]]; then commit_args=(); else commit_args=(--commit "$SHA"); fi
          python3 distro/debian/prepare.py "$RUNNER_TEMP/deb-build" --archive "$GITHUB_WORKSPACE/_source/$ARCHIVE_NAME" "${commit_args[@]}"
          cd "$RUNNER_TEMP/deb-build/kwin6-script-minimize2tray-$VERSION"
          mk-build-deps --install --remove --tool 'apt-get -y --no-install-recommends' debian/control
          dpkg-buildpackage -b -us -uc -j2
          package="$RUNNER_TEMP/deb-build/kwin6-script-minimize2tray_${DEB_VERSION}_amd64.deb"
          test -s "$package" || { echo "::error::Expected DEB not found: $package"; exit 1; }
          [[ "$(dpkg-deb --field "$package" Package)" == 'kwin6-script-minimize2tray' ]]
          [[ "$(dpkg-deb --field "$package" Version)" == "$DEB_VERSION" ]]
          [[ "$(dpkg-deb --field "$package" Architecture)" == 'amd64' ]]
          dpkg-deb --contents "$package" | grep -F 'kcm_minimize2tray.so'
          dpkg-deb --contents "$package" | grep -F 'trayiconplugin.so'
          dpkg-deb --contents "$package" | grep -F 'com.github.luisbocanegra.minimize2tray/'
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp -v "$package" "$GITHUB_WORKSPACE/dist/kwin6-script-minimize2tray_${DEB_VERSION}_${LABEL}_amd64.deb"

      - name: Upload distro-specific DEB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pkg-${{ matrix.label }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  archlinux:
    name: Arch Linux package and source recipes (x86_64)
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'archlinux'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: archlinux:base-devel
    steps:
      - name: Update Arch build tooling
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed base-devel python cmake extra-cmake-modules ninja
          useradd --user-group --create-home builder
          printf '%s\n' 'builder ALL=(root) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/minimize2tray-builder
          chmod 0440 /etc/sudoers.d/minimize2tray-builder

      - name: Download pinned source archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pinned-source
          path: _source

      - name: Build Arch package as an unprivileged user
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.source_sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ARCHIVE_NAME: ${{ needs.prepare.outputs.archive_name }}
          ARCHIVE_SHA256: ${{ needs.prepare.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          echo "$ARCHIVE_SHA256  _source/$ARCHIVE_NAME" | sha256sum --check --strict
          work="$RUNNER_TEMP/arch-build"
          mkdir "$work"
          mkdir "$work/source"
          tar -xzf "_source/$ARCHIVE_NAME" -C "$work/source" --strip-components=1
          if [[ -n "$TAG" ]]; then commit_args=(); else commit_args=(--commit "$SHA"); fi
          python3 "$work/source/distro/prepare.py" arch "$work/package" --archive "$GITHUB_WORKSPACE/_source/$ARCHIVE_NAME" --sha256 "$ARCHIVE_SHA256" "${commit_args[@]}"
          chown -R builder:builder "$work"
          cd "$work/package"
          runuser -u builder -- makepkg --syncdeps --noconfirm --cleanbuild
          runuser -u builder -- bash -c 'makepkg --printsrcinfo > .SRCINFO'
          shopt -s nullglob
          packages=(kwin6-script-minimize2tray-"$VERSION"-*-x86_64.pkg.tar.zst)
          [[ ${#packages[@]} -eq 1 && -s "${packages[0]}" ]]
          [[ "$(pacman -Qp "${packages[0]}")" == "kwin6-script-minimize2tray $VERSION-"* ]]
          pacman -Qlp "${packages[0]}" | grep -F 'kcm_minimize2tray.so'
          pacman -Qlp "${packages[0]}" | grep -F 'trayiconplugin.so'
          pacman -Qlp "${packages[0]}" | grep -F 'com.github.luisbocanegra.minimize2tray/'
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "${packages[0]}" "$GITHUB_WORKSPACE/dist/"
          tar -czf "$GITHUB_WORKSPACE/dist/kwin6-script-minimize2tray-$VERSION-archlinux-src.tar.gz" PKGBUILD .SRCINFO source-selection

      - name: Upload Arch binary and source recipes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pkg-archlinux
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  gentoo:
    name: Gentoo overlay metadata and Manifest checks
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'gentoo'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: gentoo/stage3:desktop
    steps:
      - name: Obtain Gentoo eclasses and profiles
        shell: bash
        run: |
          set -euo pipefail
          emerge-webrsync

      - name: Download pinned source archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pinned-source
          path: _source

      - name: Prepare and validate Gentoo overlay without installing the application
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.source_sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ARCHIVE_NAME: ${{ needs.prepare.outputs.archive_name }}
          ARCHIVE_SHA256: ${{ needs.prepare.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          echo "$ARCHIVE_SHA256  _source/$ARCHIVE_NAME" | sha256sum --check --strict
          work="$RUNNER_TEMP/gentoo-build"
          mkdir "$work"
          mkdir "$work/source"
          tar -xzf "_source/$ARCHIVE_NAME" -C "$work/source" --strip-components=1
          if [[ -n "$TAG" ]]; then commit_args=(); else commit_args=(--commit "$SHA"); fi
          python3 "$work/source/distro/prepare.py" gentoo "$work/package" --archive "$GITHUB_WORKSPACE/_source/$ARCHIVE_NAME" --sha256 "$ARCHIVE_SHA256" "${commit_args[@]}"
          export PORTAGE_REPOSITORIES="[DEFAULT]
          main-repo = gentoo
          [gentoo]
          location = /var/db/repos/gentoo
          [minimize2tray]
          location = $work/package/overlay
          masters = gentoo"
          export DISTDIR="$work/package/distfiles"
          recipe="$work/package/overlay/kde-misc/kwin6-script-minimize2tray/kwin6-script-minimize2tray-$VERSION.ebuild"
          manifest="$(dirname "$recipe")/Manifest"
          cp "$manifest" "$work/expected-Manifest"
          ebuild --force "$recipe" manifest
          cmp "$manifest" "$work/expected-Manifest"
          mkdir -p dist
          tar -czf "dist/kwin6-script-minimize2tray-$VERSION-gentoo-overlay.tar.gz" -C "$work/package" overlay source-selection

      - name: Upload Gentoo source overlay
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pkg-gentoo
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Release when all builds and packaging checks pass
    if: github.event_name == 'push' || inputs.publish == true
    needs: [prepare, tumbleweed, debian_ubuntu, archlinux, gentoo]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Download distribution packages only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pkg-*
          path: release-assets
          merge-multiple: true

      - name: Download the shared source archive for publication
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pinned-source
          path: release-assets

      - name: Verify all targets and generate checksum manifest
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DEB_VERSION: ${{ needs.prepare.outputs.deb_version }}
          ARCHIVE_NAME: ${{ needs.prepare.outputs.archive_name }}
          ARCHIVE_SHA256: ${{ needs.prepare.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          rpms=(release-assets/kwin6-script-minimize2tray-"$VERSION"-*.x86_64.rpm)
          debian="release-assets/kwin6-script-minimize2tray_${DEB_VERSION}_debian13_amd64.deb"
          ubuntu="release-assets/kwin6-script-minimize2tray_${DEB_VERSION}_ubuntu2604_amd64.deb"
          arch=(release-assets/kwin6-script-minimize2tray-"$VERSION"-*-x86_64.pkg.tar.zst)
          arch_source="release-assets/kwin6-script-minimize2tray-$VERSION-archlinux-src.tar.gz"
          gentoo="release-assets/kwin6-script-minimize2tray-$VERSION-gentoo-overlay.tar.gz"
          source="release-assets/$ARCHIVE_NAME"
          assets=(release-assets/*)
          [[ ${#rpms[@]} -eq 1 && ${#arch[@]} -eq 1 && ${#assets[@]} -eq 7 ]] || { echo '::error::Missing/duplicate or unexpected distribution package.'; exit 1; }
          for package in "${rpms[@]}" "$debian" "$ubuntu" "${arch[@]}" "$arch_source" "$gentoo" "$source"; do
            [[ -f "$package" && ! -L "$package" && -s "$package" ]] || { echo "::error::Missing/empty or unsafe package: $package"; exit 1; }
          done
          echo "$ARCHIVE_SHA256  $source" | sha256sum --check --strict
          (cd release-assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Publish new GitHub Release (never replace an existing one)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_TAG" ]] || { echo '::error::Tag is required for publication.'; exit 1; }
          # Query failures stop publication; they are never treated as an absent release.
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id')"
          if [[ -n "$existing" ]]; then
            echo "::error::Release $RELEASE_TAG already exists. Refusing to overwrite it."; exit 1
          fi
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$RELEASE_TAG" --jq '.sha')"
          [[ "$current_sha" == "$SOURCE_SHA" ]] || { echo '::error::Tag changed during the build. Refusing to publish.'; exit 1; }
          gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Minimize2Tray $RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
